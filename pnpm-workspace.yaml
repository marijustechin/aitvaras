packages:
  - "apps/*"
  - "packages/*"

# Allow build (install) scripts only for packages that genuinely need them.
# Prisma downloads its engines on install; esbuild/oxide provide native binaries
# used by Vitest and Tailwind CSS. Everything else stays script-free by default.
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  prisma: true
  esbuild: true
  "@tailwindcss/oxide": true
  sharp: true
  "@swc/core": true
